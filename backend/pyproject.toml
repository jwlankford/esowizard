[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eso-wizard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "pgvector==0.5.1",
  "psycopg[binary]==3.3.8",
  "google-genai==3.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.4"]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
